<!-- Indica que o documento é um site em HTML5 -->
<!DOCTYPE html>

<!-- Início da página com idioma em Português do Brasil -->
<html lang="pt-br">

<head>

    <!-- Faz o site se ajustar bem na tela do celular e do computador -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Título que aparece lá na aba do navegador -->
    <title>Display</title>
    
    <!-- Conecta o HTML com o seu arquivo de estilos (style.css) -->

</head>

            <li class="link-lista">link lista 01</li>
