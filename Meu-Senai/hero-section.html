<!-- Indica ao navegador que este arquivo é um documento HTML5 -->
<!DOCTYPE html>

<!-- Início da página web com o idioma configurado para Português do Brasil -->
<html lang="pt-br">

<head>
    <!-- Permite que o site exiba corretamente acentos e caracteres como ç, á, é -->
    <meta charset="UTF-8">
    
    <!-- Configura o site para se adaptar ao tamanho da tela do celular ou computador -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Título que aparece na aba de cima do seu navegador -->
    <title>Meu SENAI</title>
    
    <!-- Conecta o HTML ao seu arquivo de estilos CSS chamado 'hero-section.css' -->
    <link rel="stylesheet" href="./hero-section.css">
</head>

<body>

    <!-- CABEÇALHO: Parte superior da página -->
    <header class="content-header">
        <!-- Caixa que guarda o banner principal do topo -->
        <div class="banner-header">
            <samp>banner</samp>
        </div>
    </header>

    <!-- SEÇÃO PRINCIPAL (HERO): Área em destaque no meio da página -->
    <section class="hero-content">
        <!-- Coluna da esquerda -->
        <div class="hero-content--left"><samp>left</samp></div>
        
        <!-- Coluna do meio (centro) -->
        <div class="hero-content--center"><samp>center</samp></div>
        
        <!-- Coluna da direita -->
        <div class="hero-content--right"><samp>right</samp></div>
    </section>

</body>
</html>
